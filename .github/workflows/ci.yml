name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-backend:
    name: Python backend (smoke check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile $(find app scripts -name "*.py")

  node-whatsapp-service:
    name: Node whatsapp-service (smoke check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: whatsapp-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check index.js
